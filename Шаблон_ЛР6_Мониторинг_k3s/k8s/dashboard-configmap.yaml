apiVersion: v1
kind: ConfigMap
metadata:
  name: microservice-observability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  microservice-observability.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"$namespace\",service=\"$service\"}[5m]))", "legendFormat": "RPS"}],
          "title": "Запросы в секунду",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\",service=\"$service\"}[5m])))", "legendFormat": "p95"}],
          "title": "p95 задержка",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"$namespace\",service=\"$service\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=\"$namespace\",service=\"$service\"}[5m])), 0.001)", "legendFormat": "5xx"}],
          "title": "Доля HTTP 5xx",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"showTime": true, "wrapLogMessage": true},
          "targets": [{"expr": "{namespace=\"$namespace\",service=\"$service\"} | json", "refId": "A"}],
          "title": "Логи сервиса",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["microservices", "lab6"],
      "templating": {
        "list": [
          {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "definition": "label_values(http_requests_total, namespace)",
            "name": "namespace",
            "query": {"query": "label_values(http_requests_total, namespace)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "refresh": 1,
            "type": "query"
          },
          {
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "definition": "label_values(http_requests_total{namespace=\"$namespace\"}, service)",
            "name": "service",
            "query": {"query": "label_values(http_requests_total{namespace=\"$namespace\"}, service)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "refresh": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-30m", "to": "now"},
      "title": "Microservice Observability",
      "uid": "microservice-observability",
      "version": 1
    }

