apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=8r/s;
      map $http_x_request_id $correlation_id {
        default $http_x_request_id;
        "" $request_id;
      }
      log_format correlation '$remote_addr request_id=$correlation_id status=$status request="$request"';
      access_log /dev/stdout correlation;
      error_log /dev/stderr warn;
      upstream rest_facade { server rest-facade:8000; }
      server {
        listen 8080;
        location = /health {
          proxy_connect_timeout 1s;
          proxy_read_timeout 2s;
          proxy_pass http://rest_facade/health;
        }
        location /api/v1/ {
          limit_req zone=api_per_ip burst=4 nodelay;
          limit_req_status 429;
          proxy_connect_timeout 1s;
          proxy_read_timeout 2s;
          proxy_set_header X-Request-ID $correlation_id;
          proxy_set_header X-Forwarded-Proto $scheme;
          add_header X-Request-ID $correlation_id always;
          proxy_pass http://rest_facade;
        }
        location / { return 404; }
      }
    }

